<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SkyForge AI — the problem</title>
<style>
  :root{--ink:#1C1838;--ink-2:#4A4668;--tomato:#FF5A5A;--cobalt:#4361EE;--orchid:#9157FF;--teal:#0EB5A8;--sun:#FFAE1A;--pink:#F2479A;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{
    font-family:-apple-system,"Helvetica Neue",Inter,system-ui,sans-serif;
    background:radial-gradient(1200px 800px at 18% 12%, #2A2458 0%, transparent 60%),
               radial-gradient(1000px 900px at 88% 88%, #1b2a6b 0%, transparent 62%),
               linear-gradient(140deg,#14112E 0%,#1C1838 55%,#241E46 100%);
    color:#fff;display:grid;place-items:center;
  }
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:72px 72px;mask-image:radial-gradient(900px 600px at 50% 45%,#000 10%,transparent 85%)}
  .wrap{position:relative;width:1420px;text-align:center}
  .brand{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:46px;opacity:0;animation:up .8s .1s forwards}
  .brand img{width:76px;height:76px;filter:drop-shadow(0 8px 28px rgba(145,87,255,.55))}
  .brand .n{font-size:2.5rem;font-weight:800;letter-spacing:-.02em}
  .brand .n span{background:linear-gradient(90deg,var(--orchid),var(--cobalt));-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:4.6rem;line-height:1.08;font-weight:800;letter-spacing:-.03em;opacity:0;animation:up .9s .5s forwards}
  h1 .hl{background:linear-gradient(90deg,var(--sun),var(--tomato));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:26px;font-size:1.65rem;color:#B9B4D6;opacity:0;animation:up .9s 1.0s forwards}
  .pills{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:62px}
  .pill{display:flex;align-items:center;gap:14px;padding:20px 30px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);font-size:1.32rem;font-weight:600;opacity:0;transform:translateY(26px);animation:up .75s forwards}
  .pill .dot{width:13px;height:13px;border-radius:50%;box-shadow:0 0 18px currentColor}
  .pill:nth-child(1){animation-delay:1.5s}.pill:nth-child(2){animation-delay:1.9s}
  .pill:nth-child(3){animation-delay:2.3s}.pill:nth-child(4){animation-delay:2.7s}
  @keyframes up{to{opacity:1;transform:translateY(0)}}
  .brand,h1,.sub{transform:translateY(26px)}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="brand"><img src="logo.svg" alt="" /><div class="n">SkyForge <span>AI</span></div></div>
    <h1>Dozens of services.<br/><span class="hl">No single view of risk.</span></h1>
    <p class="sub">Every team with its own standards — and nobody owning the baseline.</p>
    <div class="pills">
      <div class="pill"><span class="dot" style="color:#FF5A5A;background:#FF5A5A"></span>Untriaged vulnerabilities</div>
      <div class="pill"><span class="dot" style="color:#4361EE;background:#4361EE"></span>Missing tests</div>
      <div class="pill"><span class="dot" style="color:#0EB5A8;background:#0EB5A8"></span>Unowned cloud spend</div>
      <div class="pill"><span class="dot" style="color:#FFAE1A;background:#FFAE1A"></span>Drifting code health</div>
    </div>
  </div>
</body>
</html>
