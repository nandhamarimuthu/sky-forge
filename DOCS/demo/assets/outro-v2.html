<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SkyForge AI — outro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --surface:#FFFFFF; --ink:#1C1838; --ink-2:#4A4668; --muted:#807D9C; --line-2:#D6CEEA;
    --tomato:#FF5A5A; --cobalt:#4361EE; --orchid:#9157FF; --teal:#0EB5A8; --sun:#FFAE1A;
    --grad: linear-gradient(135deg, #FF5A5A 0%, #C655AE 52%, #9157FF 100%);
    --shadow: 0 1px 2px rgba(28,24,56,.04), 0 14px 34px -16px rgba(91,63,180,.22);
    --shadow-lg: 0 24px 60px -20px rgba(91,63,180,.35);
    --display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
    --body:"DM Sans",system-ui,-apple-system,sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{
    font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1000px 520px at 100% -10%, #FFC9D2 0, transparent 60%),
      radial-gradient(900px 520px at 35% -18%, #D9C8FF 0, transparent 60%),
      radial-gradient(800px 600px at 0% 100%, #FFE0EC 0, transparent 60%),
      linear-gradient(180deg,#EFE9FB 0%,#E9E4F7 100%);
    display:grid;place-items:center;
  }
  .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:float 14s ease-in-out infinite;pointer-events:none}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.08)}}

  .wrap{position:relative;text-align:center;width:1560px}

  h1{font-family:var(--display);font-size:86px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
  h1 em{font-style:normal;background:var(--grad);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s ease-in-out infinite}
  @keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;margin-top:66px}
  .s{
    position:relative;overflow:hidden;background:var(--surface);border-radius:22px;
    border:1px solid rgba(214,206,234,.6);box-shadow:var(--shadow);padding:38px 26px 36px;
  }
  .s b{display:block;font-family:var(--display);font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .s p{margin-top:12px;font-size:17px;font-weight:600;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}
  .s .bar{position:absolute;left:0;bottom:0;height:6px;width:0;animation:grow 1.3s var(--ease) forwards;animation-delay:calc(var(--d)*120ms + 700ms)}
  @keyframes grow{to{width:100%}}
  .c1 b{color:var(--orchid)} .c1 .bar{background:var(--orchid)}
  .c2 b{color:var(--tomato)} .c2 .bar{background:var(--tomato)}
  .c3 b{color:var(--teal)}   .c3 .bar{background:var(--teal)}
  .c4 b{color:var(--sun)}    .c4 .bar{background:var(--sun)}

  .brand{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:72px}
  .logo-wrap{position:relative;width:76px;height:76px}
  .logo-wrap img{width:76px;height:76px;border-radius:24px;box-shadow:0 20px 48px -16px rgba(198,85,174,.8);display:block}
  .logo-wrap::after{content:"";position:absolute;inset:-12px;border-radius:34px;border:2px solid rgba(145,87,255,.35);animation:pulse 2.6s ease-out infinite}
  @keyframes pulse{from{transform:scale(.92);opacity:1}to{transform:scale(1.25);opacity:0}}
  .wordmark{font-family:var(--display);font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .wordmark em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{margin-top:20px;font-size:21px;font-weight:600;color:var(--muted);letter-spacing:.3em;text-transform:uppercase}

  .a{opacity:0;transform:translateY(28px);animation:up .85s var(--ease) forwards;animation-delay:calc(var(--d,0)*120ms + 120ms)}
  .a.pop{transform:scale(.74);animation-name:pop}
  @keyframes up{to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.74)}70%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:none}}
</style>
</head>
<body>
  <div class="blob" style="width:520px;height:520px;background:#D9C8FF;left:80px;top:70px"></div>
  <div class="blob" style="width:460px;height:460px;background:#FFC9D2;right:70px;bottom:60px;animation-delay:-5s"></div>
  <div class="blob" style="width:360px;height:360px;background:#CFE0FF;left:620px;bottom:40px;animation-delay:-9s"></div>

  <div class="wrap">
    <h1 class="a" style="--d:0">Better. Safer. <em>Cheaper.</em></h1>

    <div class="stats">
      <div class="s c1 a pop" style="--d:2"><b>Seconds</b><p>to onboard</p><span class="bar"></span></div>
      <div class="s c2 a pop" style="--d:3"><b>Verified</b><p>fixes only</p><span class="bar"></span></div>
      <div class="s c3 a pop" style="--d:4"><b>$/month</b><p>cloud savings</p><span class="bar"></span></div>
      <div class="s c4 a pop" style="--d:5"><b>One bar</b><p>for every team</p><span class="bar"></span></div>
    </div>

    <div class="brand a" style="--d:7">
      <div class="logo-wrap"><img src="logo.svg" alt="" /></div>
      <div class="wordmark">SkyForge <em>AI</em></div>
    </div>
    <p class="tag a" style="--d:9">Cloud &amp; Code Command</p>
  </div>
</body>
</html>
