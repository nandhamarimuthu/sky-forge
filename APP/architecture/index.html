<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SkyForge AI · Service Architecture</title>
<link rel="icon" href="logo.svg" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FFFFFF; color: #1C1838; font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
         padding: 36px 40px; min-width: 1100px; }
  header { display: flex; align-items: center; justify-content: space-between; max-width: 1620px; margin: 0 auto 22px;
           padding-bottom: 18px; border-bottom: 1px solid #E6E1F2; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 48px; height: 48px; border-radius: 14px; box-shadow: 0 8px 20px -8px rgba(198, 85, 174, .7); }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
  .sub { color: #807D9C; font-size: 14px; margin-top: 2px; }
  .legend { display: flex; gap: 22px; font-size: 12.5px; color: #4A4668; }
  .legend span { display: flex; align-items: center; gap: 8px; }
  svg.diagram { display: block; width: 100%; max-width: 1620px; height: auto; margin: 0 auto; }

  .zone { font: 700 11.5px Inter, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .14em; fill: #807D9C; }
  .row  { font: 700 11px Inter, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .16em; }
  .t    { font: 700 16px Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1C1838; }
  .s    { font: 400 12.5px Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #807D9C; }
  .chip { font: 600 13px Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1C1838; }
  .num  { font: 700 12px Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
  .note { font: 600 12px Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #807D9C; }
  .card { fill: #FFFFFF; stroke: #D6CEEA; stroke-width: 1.5; }
  .flow { stroke: #8E86B5; stroke-width: 2; fill: none; }
  .uses { stroke: #B9B0D6; stroke-width: 1.8; fill: none; stroke-dasharray: 6 6; }

  @media print { body { padding: 10px; min-width: 0; } @page { size: A3 landscape; margin: 10mm; } }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="logo.svg" alt="SkyForge AI" />
      <div>
        <h1>SkyForge AI</h1>
        <div class="sub">Service Architecture &amp; Flow</div>
      </div>
    </div>
    <div class="legend">
      <span><svg width="34" height="10"><line x1="0" y1="5" x2="26" y2="5" stroke="#8E86B5" stroke-width="2"/><path d="M26 0L34 5L26 10z" fill="#8E86B5"/></svg>Primary flow</span>
      <span><svg width="34" height="10"><line x1="0" y1="5" x2="34" y2="5" stroke="#B9B0D6" stroke-width="2" stroke-dasharray="6 5"/></svg>Uses</span>
    </div>
  </header>

  <svg class="diagram" viewBox="0 0 1620 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SkyForge AI service flow">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#8E86B5" />
      </marker>
      <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#B9B0D6" />
      </marker>
      <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FF5A5A" /><stop offset=".5" stop-color="#9157FF" /><stop offset="1" stop-color="#4361EE" />
      </linearGradient>
      <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#9157FF" flood-opacity=".12" />
      </filter>
    </defs>

    <!-- GitHub zone -->
    <rect x="30" y="20" width="210" height="500" rx="18" fill="#F7F5FC" />
    <text class="zone" x="135" y="52" text-anchor="middle">GITHUB</text>
    <rect class="card" x="50" y="105" width="170" height="90" rx="14" filter="url(#shadow)" />
    <text class="t" x="135" y="145" text-anchor="middle">Repository</text>
    <text class="s" x="135" y="167" text-anchor="middle">Source code · IaC</text>
    <rect class="card" x="50" y="355" width="170" height="90" rx="14" filter="url(#shadow)" />
    <text class="t" x="135" y="395" text-anchor="middle">Pull Request</text>
    <text class="s" x="135" y="417" text-anchor="middle">Draft · Reviewable</text>

    <!-- Platform boundary -->
    <rect x="290" y="20" width="1270" height="500" rx="20" fill="none" stroke="#D6CEEA" stroke-width="1.5" stroke-dasharray="8 6" />
    <image href="logo.svg" x="312" y="34" width="24" height="24" />
    <text class="zone" x="346" y="52">SKYFORGE PLATFORM</text>

    <text class="row" x="330" y="92" fill="#4361EE">SCAN</text>
    <text class="row" x="540" y="342" fill="#16C47F">REMEDIATE</text>

    <!-- 1 Ingest -->
    <rect class="card" x="330" y="105" width="200" height="90" rx="14" filter="url(#shadow)" />
    <circle cx="356" cy="150" r="13" fill="#4361EE" /><text class="num" x="356" y="154" text-anchor="middle">1</text>
    <text class="t" x="380" y="145">Ingest</text>
    <text class="s" x="380" y="167">Clone · Detect stack</text>

    <!-- 2 Orchestrator -->
    <rect class="card" x="590" y="105" width="200" height="90" rx="14" filter="url(#shadow)" />
    <circle cx="616" cy="150" r="13" fill="#9157FF" /><text class="num" x="616" y="154" text-anchor="middle">2</text>
    <text class="t" x="640" y="145">Orchestrator</text>
    <text class="s" x="640" y="167">Parallel dispatch</text>

    <!-- 3 Agent layer -->
    <rect x="850" y="60" width="670" height="190" rx="18" fill="#FFFFFF" stroke="url(#brand)" stroke-width="2" filter="url(#shadow)" />
    <circle cx="883" cy="92" r="13" fill="url(#brand)" /><text class="num" x="883" y="96" text-anchor="middle">3</text>
    <text class="t" x="907" y="98">AI Agent Layer</text>

    <rect x="870" y="118" width="200" height="50" rx="12" fill="#FFEBEB" />
    <circle cx="890" cy="143" r="5" fill="#FF5A5A" /><text class="chip" x="904" y="148">Vulnerability Fix</text>
    <rect x="1085" y="118" width="200" height="50" rx="12" fill="#E8ECFF" />
    <circle cx="1105" cy="143" r="5" fill="#4361EE" /><text class="chip" x="1119" y="148">Unit Tests</text>
    <rect x="1300" y="118" width="200" height="50" rx="12" fill="#DFF7F4" />
    <circle cx="1320" cy="143" r="5" fill="#0EB5A8" /><text class="chip" x="1334" y="148">Functional Tests</text>
    <rect x="870" y="180" width="200" height="50" rx="12" fill="#FFF3DC" />
    <circle cx="890" cy="205" r="5" fill="#FFAE1A" /><text class="chip" x="904" y="210">AWS Cost</text>
    <rect x="1085" y="180" width="200" height="50" rx="12" fill="#F2EAFF" />
    <circle cx="1105" cy="205" r="5" fill="#9157FF" /><text class="chip" x="1119" y="210">Code Health</text>
    <rect x="1300" y="180" width="200" height="50" rx="12" fill="#FDE6F1" />
    <circle cx="1320" cy="205" r="5" fill="#F2479A" /><text class="chip" x="1334" y="210">Security</text>

    <!-- 4 Guardrails -->
    <rect class="card" x="1320" y="350" width="200" height="100" rx="14" filter="url(#shadow)" />
    <circle cx="1346" cy="400" r="13" fill="#FF5A5A" /><text class="num" x="1346" y="404" text-anchor="middle">4</text>
    <text class="t" x="1370" y="395">Guardrails</text>
    <text class="s" x="1370" y="417">Policy check</text>

    <!-- 5 Approval -->
    <rect class="card" x="1060" y="350" width="200" height="100" rx="14" filter="url(#shadow)" />
    <circle cx="1086" cy="400" r="13" fill="#FFAE1A" /><text class="num" x="1086" y="404" text-anchor="middle">5</text>
    <text class="t" x="1110" y="395">Approval</text>
    <text class="s" x="1110" y="417">Human in the loop</text>

    <!-- 6 Apply & Verify -->
    <rect class="card" x="800" y="350" width="200" height="100" rx="14" filter="url(#shadow)" />
    <circle cx="826" cy="400" r="13" fill="#0EB5A8" /><text class="num" x="826" y="404" text-anchor="middle">6</text>
    <text class="t" x="850" y="395">Apply &amp; Verify</text>
    <text class="s" x="850" y="417">Isolated branch</text>

    <!-- 7 Publish -->
    <rect class="card" x="540" y="350" width="200" height="100" rx="14" filter="url(#shadow)" />
    <circle cx="566" cy="400" r="13" fill="#16C47F" /><text class="num" x="566" y="404" text-anchor="middle">7</text>
    <text class="t" x="590" y="395">Publish</text>
    <text class="s" x="590" y="417">GitHub App</text>

    <!-- Primary flow -->
    <line class="flow" x1="220" y1="150" x2="328" y2="150" marker-end="url(#arrow)" />
    <line class="flow" x1="530" y1="150" x2="588" y2="150" marker-end="url(#arrow)" />
    <line class="flow" x1="790" y1="150" x2="848" y2="150" marker-end="url(#arrow)" />
    <line class="flow" x1="1420" y1="250" x2="1420" y2="348" marker-end="url(#arrow)" />
    <text class="note" x="1432" y="304">Findings</text>
    <line class="flow" x1="1320" y1="400" x2="1262" y2="400" marker-end="url(#arrow)" />
    <line class="flow" x1="1060" y1="400" x2="1002" y2="400" marker-end="url(#arrow)" />
    <line class="flow" x1="800" y1="400" x2="742" y2="400" marker-end="url(#arrow)" />
    <line class="flow" x1="540" y1="400" x2="222" y2="400" marker-end="url(#arrow)" />

    <!-- Shared services -->
    <text class="zone" x="290" y="586">EXECUTION &amp; INTELLIGENCE</text>
    <rect x="290" y="600" width="1270" height="110" rx="18" fill="#F7F5FC" />

    <rect class="card" x="310" y="622" width="235" height="66" rx="12" />
    <text class="t" x="330" y="651">Data Store</text><text class="s" x="330" y="672">Findings · Audit trail</text>
    <rect class="card" x="558" y="622" width="235" height="66" rx="12" />
    <text class="t" x="578" y="651">AWS Cost Model</text><text class="s" x="578" y="672">Terraform · CUR</text>
    <rect class="card" x="806" y="622" width="235" height="66" rx="12" />
    <text class="t" x="826" y="651">Docker Sandbox</text><text class="s" x="826" y="672">Isolated execution</text>
    <rect class="card" x="1054" y="622" width="235" height="66" rx="12" />
    <text class="t" x="1074" y="651">Local LLM</text><text class="s" x="1074" y="672">Ollama · Gemma 3</text>
    <rect class="card" x="1302" y="622" width="235" height="66" rx="12" />
    <text class="t" x="1322" y="651">OSV.dev</text><text class="s" x="1322" y="672">Vulnerability intel</text>

    <!-- Uses -->
    <line class="uses" x1="900" y1="450" x2="900" y2="620" marker-end="url(#arrow-soft)" />
    <path class="uses" d="M1520 155 H1590 V655 H1540" marker-end="url(#arrow-soft)" />
  </svg>
</body>
</html>
